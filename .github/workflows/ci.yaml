name: CI
on:
  push:
    branches:
      - "**"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - run: deno task setup
      - run: deno task check-type
      - run: deno task check-fmt
  test-api:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: pg_pwd
      POSTGRES_USER: ci_test
      POSTGRES_DB: postgres
    services:
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ${{env.POSTGRES_PASSWORD}}
          POSTGRES_USER: ${{env.POSTGRES_USER}}
          POSTGRES_DB: ${{env.POSTGRES_DB}}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup project
        run: |
          cd web_dto && deno install --frozen
          cd ../web_api && deno install --frozen

      - name: Test
        run: deno task test
        env:
          PG_URL: pg://${{env.POSTGRES_USER}}:${{env.POSTGRES_PASSWORD}}@127.0.0.1:5432/${{env.POSTGRES_DB}}
        working-directory: ./web_api
